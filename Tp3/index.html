<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="Assets/css/style.css">
        <title>Couleur et image</title>
    </head>

    <body>

        <header>

            <h1>
                Bienvenue sur notre site exemple!
            </h1>

        </header>

        <nav>
            <span>Intro</span>
            <span>Galerie</span>
            <span>Contact</span>
        </nav>

        <main class="container">
            <section id="introduction" class="intro">
                <h2>Introduction</h2>
                <p>Ceci est un exemple de page HTML contenant différents éléments que vous pouvez manipuler avec du CSS.</p>

            </section>

            <section class="gallery">
                <h2>Galerie d'images</h2>
                <div class="images-container">
                    <div class="imagesPortait" id="un">Un</div>
                        <img src="Assets/image/arbre-dessous-min.jpg" alt = arbre en autumn vue du dessous>
                    <div class="imagesPaysage" id="deux">Deux</div>
                        <img src="Assets/image/arbre-pied-min.jpg" alt = arbre vue au niveau du sol>
                    <div class="imagesPortait" id="trois">Trois</div>
                        <img src="Assets/image/arbres-rouges.jpg" alt = arbre rouge>
                    <div class="imagesPaysage" id="quatre">Quatre</div>
                        <img src="Assets/image/arbres-brume-min.jpg" alt = arbre avec de la brume>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Exemple de Site Web</p>
        </footer>

    </body>
</html>
